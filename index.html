<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constant Difference Subtraction</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18253a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:20px}.app{max-width:850px;margin:auto}.card{background:white;border:1px solid #d9e1eb;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #152b4310}h1{font-size:clamp(22px,4vw,30px);margin:0 0 8px;text-align:center}.problem{text-align:center;font-size:clamp(28px,6vw,40px);font-weight:800;margin:8px}.sub{color:#5e6d81;font-size:13px;text-align:center}.starting{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);align-items:start;gap:10px}.group{min-width:0;text-align:center}.group strong{font-size:24px}.plus{font-size:28px;font-weight:700;padding-top:2px}.blocks{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;align-items:flex-start;gap:6px;min-height:90px;margin-top:12px}.workspace{border:2px dashed #afbed1;border-radius:12px;min-height:140px;padding:12px;justify-content:flex-start}.ten,.one,.hundred{flex-shrink:0;cursor:pointer;touch-action:manipulation;transition:transform .12s;border-radius:3px}.ten:hover,.one:hover,.hundred:hover{transform:translateY(-2px)}.ten{height:76px;width:17px;border:1px solid #2e72a9;background:repeating-linear-gradient(to bottom,#8ac8f1 0 6.6px,#2f7eaf 6.6px 7.6px)}.one{width:22px;height:22px;background:#f4c56d;border:1px solid #b78426}.hundred{width:85px;height:85px;border:1px solid #276f93;background:repeating-linear-gradient(0deg,transparent 0 7px,#4389ad 7px 8px),repeating-linear-gradient(90deg,#9bd3e7 0 7px,#4389ad 7px 8px)}.blocks button{padding:0}.blocks button:focus-visible{outline:3px solid #5c52de;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.controls button,.action{border:1px solid #c8d3e2;border-radius:9px;background:#f9fbff;padding:11px 14px;color:#17273c;font-weight:650;cursor:pointer}.controls button:disabled{opacity:.4;cursor:not-allowed}.controls .reset{margin-left:auto}.action{background:#5144c6;color:white;border-color:#5144c6}.answer{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}.answer input{width:125px;font-size:23px;padding:9px;border:1px solid #bccadd;border-radius:9px;text-align:center}.feedback{text-align:center;min-height:25px;font-weight:650;margin-top:12px}.legend{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:#65758a;font-size:12px}.legend .ten{height:35px;width:9px}.legend .one{height:16px;width:16px}.legend .hundred{height:29px;width:29px}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.heading h2{font-size:17px;margin:0}.small{font-size:13px;color:#63758b}.empty{color:#8491a2;font-size:13px;margin:auto}.workspace .empty{align-self:center}button:focus-visible{outline:3px solid #7268e4;outline-offset:2px}@media(max-width:450px){body{padding:10px}.card{padding:12px}.controls button{flex:1 1 auto;padding:10px 8px;font-size:12px}.controls .reset{margin-left:0}.blocks{gap:4px}.one{width:19px;height:19px}}
.eq{display:flex;align-items:center;justify-content:center;gap:18px;font-size:clamp(34px,9vw,60px);font-weight:800;padding:18px 8px;border-radius:14px;border:3px solid transparent;transition:background .2s,border-color .2s;font-variant-numeric:tabular-nums}
.eq.good{background:#e3f6ea;border-color:#2e9e62}
.eq .bad{color:#c43a3a}
.eq.good .num{color:#18714a}
.status{text-align:center;font-weight:700;min-height:24px;margin-top:6px;color:#6a7a8f}
.status.good{color:#18845a}
.adj{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.adj button{font-size:18px;padding:14px 22px;border-radius:12px;border:1px solid #c8d3e2;background:#f9fbff;font-weight:750;color:#17273c;cursor:pointer}
.adj button:hover:not(:disabled){background:#eef1ff}
.adj button:disabled{opacity:.4;cursor:not-allowed}
.trail{text-align:center;font-size:14px;color:#5e6d81;margin-top:10px;min-height:20px}
.orig{text-align:center;color:#5e6d81;font-size:14px;margin-bottom:4px}

</style>
</head>
<body><main class="app">
<h1>Constant Difference</h1><div class="sub">Add the same amount to both numbers. The difference stays the same. Keep going until no regrouping is needed.</div>
<section class="card"><div class="orig" id="orig"></div>
<div class="eq" id="eq" aria-live="polite"><span class="num" id="top"></span><span>&minus;</span><span class="num" id="bot"></span></div>
<div class="status" id="status"></div>
<div class="adj"><button id="p1" type="button">+1 to both</button><button id="p10" type="button">+10 to both</button><button id="undo" type="button">Undo</button><button id="reset" type="button">Start over</button></div>
<div class="trail" id="trail"></div></section>
<section class="card"><form id="form" class="answer"><label for="answer"><strong>Answer:</strong></label><input id="answer" type="number" step="1" inputmode="numeric" autocomplete="off" placeholder="?" required><button class="action" type="submit">Submit</button></form><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div style="text-align:center;margin-top:12px"><button id="next" type="button" class="action">New problem &#8635;</button></div></section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
let a0=52,b0=27,steps=[];
const cur=()=>{const add=steps.reduce((s,x)=>s+x,0);return [a0+add,b0+add,add];};
// A place needs regrouping when the bottom digit is bigger than the top digit.
function badPlaces(a,b){const A=String(a),B=String(b).padStart(A.length,'0'),out=[];for(let i=0;i<A.length;i++)if(+B[i]>+A[i])out.push(i);return out;}
function render(){
 const [a,b,add]=cur();const bad=badPlaces(a,b);const good=!bad.length;
 $('orig').textContent=`Starting problem: ${a0} \u2212 ${b0}`;
 $('top').textContent=a;
 $('bot').innerHTML=String(b).split('').map((d,i)=>{const off=String(a).length-String(b).length;return bad.includes(i+off)?`<span class="bad">${d}</span>`:d;}).join('');
 $('eq').classList.toggle('good',good);
 $('status').className='status'+(good?' good':'');
 $('status').textContent=good?'\u2713 No regrouping needed!':'Some digits need regrouping';
 $('trail').textContent=steps.length?`Added ${add} to both: ${steps.map(s=>'+'+s).join(' ')}`:'';
 $('undo').disabled=!steps.length;$('reset').disabled=!steps.length;
 $('p1').disabled=$('p10').disabled=b>=9999;}
function setup(a,b){a0=a;b0=b;steps=[];$('answer').value='';$('feedback').textContent='';render();}
const push=n=>{steps.push(n);$('feedback').textContent='';render();};
$('p1').onclick=()=>push(1);$('p10').onclick=()=>push(10);
$('undo').onclick=()=>{steps.pop();render();};
$('reset').onclick=()=>{steps=[];$('feedback').textContent='';render();};
$('form').onsubmit=e=>{e.preventDefault();const v=$('answer').value.trim();if(!v)return;const ok=Number(v)===a0-b0;$('feedback').style.color=ok?'#18845a':'#bb3d3d';$('feedback').textContent=ok?'\u2713 Correct! Great work.':'Not quite. Try again with the easier problem.';};
$('next').onclick=()=>{let a,b;do{a=21+Math.floor(Math.random()*79);b=11+Math.floor(Math.random()*(a-11));}while(!(b<a&&b%10>a%10));setup(a,b);};
setup(52,27);
})();
</script></body></html>
